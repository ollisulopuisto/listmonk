name: Daily Upstream Sync

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync Upstream Master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: master
          token: ${{ secrets.GHCR_PAT || github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.27'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Fetch upstream master
        run: |
          git remote add upstream https://github.com/knadh/listmonk.git || git remote set-url upstream https://github.com/knadh/listmonk.git
          git fetch upstream master

      - name: Check for upstream changes
        id: check_upstream
        run: |
          NEW_COMMITS=$(git rev-list HEAD..upstream/master --count)
          echo "New upstream commits: $NEW_COMMITS"
          echo "new_commits=$NEW_COMMITS" >> $GITHUB_OUTPUT
          if [ "$NEW_COMMITS" -eq 0 ]; then
            echo "Master is already up to date with upstream/master."
          fi

      - name: Sync and validate upstream changes
        if: steps.check_upstream.outputs.new_commits != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_TAG=$(date +'%Y-%m-%d')
          BRANCH_TAG=$(date +'%Y%m%d-%H%M%S')
          SYNC_BRANCH="sync/upstream-$BRANCH_TAG"

          echo "Attempting real merge of upstream/master into master..."

          # Attempt merge
          if ! git merge upstream/master --no-edit -m "Merge upstream/master ($DATE_TAG) — sync upstream changes"; then
            echo "::error::Merge conflict encountered when merging upstream/master."
            git merge --abort || true

            # Create branch from master and merge upstream/master preserving fork workflows
            git checkout -b "$SYNC_BRANCH" origin/master
            git merge upstream/master --no-edit -m "Merge upstream/master ($DATE_TAG) — sync upstream changes" || true
            git checkout origin/master -- .github/workflows/
            git clean -fd .github/workflows/
            git add -A
            git commit -m "sync: upstream/master merge conflict ($DATE_TAG)" || true
            git push origin "$SYNC_BRANCH"

            gh pr create --repo ollisulopuisto/listmonk \
              --base master \
              --head "$SYNC_BRANCH" \
              --title "sync: upstream/master merge conflict ($DATE_TAG)" \
              --body "Automated daily upstream sync encountered merge conflicts when trying to merge \`upstream/master\` into \`master\`. Please resolve conflicts manually following the editor integrity and migration guidelines in GEMINI.md."

            exit 1
          fi

          echo "Merge completed cleanly. Running integrity checks..."

          echo "Running Go tests..."
          if ! go test ./...; then
            echo "::error::Go tests failed after merging upstream/master."
            git checkout -b "$SYNC_BRANCH"
            git checkout origin/master -- .github/workflows/
            git clean -fd .github/workflows/
            git commit -am "sync: Go test failure after upstream merge ($DATE_TAG)" || true
            git push origin "$SYNC_BRANCH"

            gh pr create --repo ollisulopuisto/listmonk \
              --base master \
              --head "$SYNC_BRANCH" \
              --title "sync: Go test failure after upstream merge ($DATE_TAG)" \
              --body "Go tests failed after merging \`upstream/master\` into \`master\`. Manual resolution required."

            exit 1
          fi

          echo "Running SSR admin frontend dependencies and build..."
          if ! (cd static/admin && bun install --frozen-lockfile && bun run build); then
            echo "::error::SSR admin frontend build failed after merging upstream/master."
            git checkout -b "$SYNC_BRANCH"
            git checkout origin/master -- .github/workflows/
            git clean -fd .github/workflows/
            git commit -am "sync: Frontend build failure after upstream merge ($DATE_TAG)" || true
            git push origin "$SYNC_BRANCH"

            gh pr create --repo ollisulopuisto/listmonk \
              --base master \
              --head "$SYNC_BRANCH" \
              --title "sync: Frontend build failure after upstream merge ($DATE_TAG)" \
              --body "SSR admin frontend build failed after merging \`upstream/master\` into \`master\`. Manual resolution required."

            exit 1
          fi

          echo "All checks passed! Pushing merged master to origin..."
          git push origin master
