name: Daily Upstream Sync

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One sync at a time: the "is a sync PR/issue already open" checks and the create
# calls are not atomic, so scheduled and manual runs must not overlap. A running
# sync is never cancelled. GitHub keeps only one pending run per group, so a run
# queued behind it can be replaced by a newer one; that is fine here because every
# run merges whatever upstream/master is at that moment.
concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    name: Sync Upstream Master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: master
          token: ${{ secrets.GHCR_PAT || github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.27'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Fetch upstream master
        run: |
          git remote add upstream https://github.com/knadh/listmonk.git || git remote set-url upstream https://github.com/knadh/listmonk.git
          git fetch upstream master

      - name: Check for upstream changes
        id: check_upstream
        run: |
          NEW_COMMITS=$(git rev-list HEAD..upstream/master --count)
          echo "New upstream commits: $NEW_COMMITS"
          echo "new_commits=$NEW_COMMITS" >> $GITHUB_OUTPUT
          if [ "$NEW_COMMITS" -eq 0 ]; then
            echo "Master is already up to date with upstream/master."
          fi

      - name: Sync and validate upstream changes
        if: steps.check_upstream.outputs.new_commits != '0'
        env:
          # Opening the PR with the built-in GITHUB_TOKEN would not start its
          # pull_request checks; use the same PAT as the push when it is set.
          GH_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          DATE_TAG=$(date +'%Y-%m-%d')
          BRANCH_TAG=$(date +'%Y%m%d-%H%M%S')
          SYNC_BRANCH="sync/upstream-$BRANCH_TAG"
          UPSTREAM_SHA=$(git rev-parse upstream/master)
          ISSUE_TITLE="Upstream sync blocked"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # A sync PR that is still open means a human has not looked at the last
          # one yet. Do not stack another one on top of it.
          OPEN_SYNC_PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base master \
            --json headRefName --jq '[.[] | select(.headRefName | startswith("sync/upstream-"))] | length')
          if [ "$OPEN_SYNC_PRS" -gt 0 ]; then
            echo "::notice::An upstream sync PR is already open; skipping this run."
            exit 0
          fi

          # Record why the sync cannot go ahead in ONE open issue (updated in place,
          # so a daily run does not pile up issues or comments). Nothing is pushed:
          # a half-merged tree with conflict markers must never reach a branch.
          report_blocked() {
            local reason="$1" details="$2"
            local body existing
            body=$(printf '%s\n\n%s\n\nUpstream commit: `%s`\nWorkflow run: %s\nLast checked: %s\n\nThe daily sync leaves master untouched while this issue is open. Merge `upstream/master` by hand (a real merge commit, so the merge base stays current), then close this issue.\n' \
              "$reason" "$details" "$UPSTREAM_SHA" "$RUN_URL" "$DATE_TAG")
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" \
              --json number,title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
              echo "::warning::Upstream sync blocked; updated issue #$existing."
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$body"
              echo "::warning::Upstream sync blocked; opened an issue."
            fi
          }

          echo "Attempting real merge of upstream/master into master..."

          # Merge on a branch, never on master, so nothing can reach master from here.
          git checkout -b "$SYNC_BRANCH" origin/master

          if ! git merge upstream/master --no-ff --no-edit -m "Merge upstream/master ($DATE_TAG) — sync upstream changes"; then
            CONFLICTS=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
            git merge --abort || true
            echo "::warning::Merge conflict encountered when merging upstream/master."
            report_blocked "Merging \`upstream/master\` into \`master\` conflicts in these files:" "$CONFLICTS"
            exit 0
          fi

          # Fork workflows stay as they are on master; upstream's are not taken.
          if ! git diff --quiet origin/master HEAD -- .github/workflows/; then
            # Also removes workflow files that upstream added.
            git restore --source=origin/master --staged --worktree -- .github/workflows/
            git commit -m "sync: keep fork workflows ($DATE_TAG)"
          fi

          echo "Merge completed cleanly. Running integrity checks..."

          echo "Running Go tests..."
          if ! go test ./...; then
            report_blocked "The merge is clean but \`go test ./...\` fails after it." "See the workflow run for the failing tests."
            exit 0
          fi

          echo "Running SSR admin frontend dependencies and build..."
          if ! (cd static/admin && bun install --frozen-lockfile && bun run build); then
            report_blocked "The merge is clean but the SSR admin frontend build fails after it." "See the workflow run for the build output."
            exit 0
          fi

          echo "All checks passed! Opening a PR for the merged upstream changes..."
          git push origin "$SYNC_BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base master \
            --head "$SYNC_BRANCH" \
            --title "sync: upstream/master ($DATE_TAG)" \
            --body "Clean merge of \`upstream/master\` (\`$UPSTREAM_SHA\`) into \`master\`. Go tests and the admin frontend build passed in the sync run. Merge it with a merge commit (not squash) so the merge base stays current."

          # The sync is unblocked again: close the tracking issue if one is open.
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "The upstream merge is clean again; see the sync PR."
          fi
