name: Build and Deploy

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1. TEST GATE: Code must pass logic checks before building
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.26.1'

      - name: Run tests
        run: go test ./...

  # 1b. FRONTEND TEST GATE: unit tests, eslint, and the i18n key check.
  #
  # Cypress is deliberately NOT run here. The e2e specs inherited from upstream
  # drive TinyMCE directly (win.tinymce.editors[0], .tox-dialog selectors), and
  # this fork replaced TinyMCE with Tiptap, so those specs cannot pass as-is.
  # Wiring them in would mean a permanently red gate. They need porting to
  # Tiptap first.
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # jsdom requires ^22.22.2 || ^24.15.0 || >=26; 24 sits safely inside.
          node-version: '24'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint (eslint + i18n keys)
        run: yarn lint

      - name: Run unit tests
        run: yarn test

  # 2. BUILD GATE: Image must build successfully before deploying.
  #
  # This also runs on pull_request (build only, no push). It used to be gated to
  # push events, which meant the Docker build was never exercised before merge:
  # a frontend change that built fine locally could still break the image and
  # only fail once it was already on master, blocking staging deploys.
  build-and-push:
    needs: [test, frontend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.calver.outputs.version }}
      sha_short: ${{ steps.slug.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Get short SHA
        id: slug
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Generate CalVer
        id: calver
        run: |
          VERSION=$(date +'%y.%m.%d').$(git rev-list --count HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          # On pull_request the image is built as a gate but not published.
          push: ${{ github.event_name == 'push' }}
          build-args: |
            APP_VERSION=${{ steps.calver.outputs.version }}
          tags: |
            ghcr.io/ollisulopuisto/listmonk:latest
            ghcr.io/ollisulopuisto/listmonk:${{ steps.calver.outputs.version }}
            ghcr.io/ollisulopuisto/listmonk:${{ steps.slug.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git Tag
        if: github.ref == 'refs/heads/master'
        run: |
          git tag v${{ steps.calver.outputs.version }}
          git push origin v${{ steps.calver.outputs.version }}

  # 3. DEPLOY: Only runs if test AND build passed
  deploy-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote deploy script (Staging)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            /opt/stacks/scripts/deploy.sh listmonk deploy ${{ needs.build-and-push.outputs.version }}

  deploy-prod:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote deploy script (Production)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            /opt/stacks/scripts/deploy.sh listmonk promote
